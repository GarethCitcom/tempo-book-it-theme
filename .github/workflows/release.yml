# Publishes a theme release.
#
# Two ways in, one code path:
#
#   push a v* tag       the usual route — tag the merge commit and push.
#   run it by hand      Actions → Release → Run workflow, on main. The tag is
#                       derived from style.css and created by the release step,
#                       so there is nothing to type and nothing to mistype.
#
# Two artifacts, both attached to the GitHub release:
#
#   tempo-book-it-theme.zip  the installable theme, unpacking to a folder named
#                            exactly tempo-book-it-theme/ — which is what makes
#                            it install and update in place. GitHub's own source
#                            zip unpacks to a versioned folder and cannot.
#   update.json              the manifest inc/updates.php polls, reached through
#                            the releases/latest/download/ URL that always
#                            resolves to the newest release.
#
# Everything published here is derived from style.css, so the theme headers stay
# the single source of truth for version and requirements.

name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Check out the commit being released
        uses: actions/checkout@v4

      - name: Read the theme headers
        id: theme
        run: |
          set -euo pipefail
          header() {
            sed -n "s/^$1:[[:space:]]*//p" style.css | head -1 | tr -d '\r'
          }
          {
            echo "version=$(header 'Version')"
            echo "requires=$(header 'Requires at least')"
            echo "requires_php=$(header 'Requires PHP')"
            echo "tested=$(header 'Tested up to')"
          } >> "$GITHUB_OUTPUT"

      - name: Settle on the tag
        id: tag
        env:
          VERSION: ${{ steps.theme.outputs.version }}
        run: |
          set -euo pipefail
          if [ -z "$VERSION" ]; then
            echo "No Version header in style.css." >&2
            exit 1
          fi

          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            # Tag route: the tag is authoritative, and must match the header —
            # a release announcing a version the theme does not carry would
            # leave every site re-offered an update it already installed.
            if [ "${GITHUB_REF_NAME#v}" != "$VERSION" ]; then
              echo "Tag $GITHUB_REF_NAME does not match style.css Version $VERSION." >&2
              echo "Bump the header and retag." >&2
              exit 1
            fi
            tag="$GITHUB_REF_NAME"
          else
            # Manual route: the header is authoritative and the release step
            # creates the tag at this commit.
            tag="v$VERSION"
          fi

          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "Releasing $tag"

      - name: Refuse to republish an existing release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          set -euo pipefail
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists. Bump the Version header first." >&2
            exit 1
          fi

      - name: Build the installable zip
        run: |
          set -euo pipefail
          git archive --format=zip --prefix=tempo-book-it-theme/ \
            -o tempo-book-it-theme.zip HEAD
          unzip -l tempo-book-it-theme.zip

      - name: Write the update manifest
        env:
          REPO: ${{ github.repository }}
          TAG: ${{ steps.tag.outputs.tag }}
          VERSION: ${{ steps.theme.outputs.version }}
          REQUIRES: ${{ steps.theme.outputs.requires }}
          REQUIRES_PHP: ${{ steps.theme.outputs.requires_php }}
          TESTED: ${{ steps.theme.outputs.tested }}
        run: |
          set -euo pipefail
          jq -n \
            --arg version "$VERSION" \
            --arg requires "$REQUIRES" \
            --arg requires_php "$REQUIRES_PHP" \
            --arg tested "$TESTED" \
            --arg url "https://github.com/$REPO/releases/tag/$TAG" \
            --arg download_url "https://github.com/$REPO/releases/download/$TAG/tempo-book-it-theme.zip" \
            '{
               name: "Tempo Book It Theme",
               theme: "tempo-book-it-theme",
               version: $version,
               requires: $requires,
               requires_php: $requires_php,
               tested: $tested,
               url: $url,
               download_url: $download_url
             }' > update.json
          cat update.json

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          set -euo pipefail
          gh release create "$TAG" \
            tempo-book-it-theme.zip \
            update.json \
            --target "$GITHUB_SHA" \
            --title "$TAG" \
            --generate-notes
